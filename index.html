<!DOCTYPE html>

	<meta charset="UTF-8"/>
	<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<script>
			// 窄屏适配：viewport=700 + 字体补偿，利用浏览器原生缩放
			(function() {
				var sw = window.screen.width;
				if (sw < 768 && sw > 0) {
					// viewport 设为 700，浏览器会把 700px 缩放到屏幕宽度
					document.getElementById('viewportMeta').content =
						'width=700, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
					// 字体补偿：浏览器缩小了多少，我们就放大多少
					var ratio = 700 / sw;
					var baseSize = Math.round(16 * ratio);
					document.documentElement.style.fontSize = baseSize + 'px';
					document.body.style.fontSize = baseSize + 'px';
				}
			})();
		</script>

	<script>
		// try to read "lang" param's from url
		var lang = decodeURIComponent((new RegExp('[?|&]lang=' + '([^&;]+?)(&|#|;|$)').exec(location.search)||[,""])[1].replace(/\+/g, '%20'))||null;
		// if no language requested, try to read it from local storage
		if(!lang){
			try {
				lang = localStorage.lang;
			} catch(e) {}
		}
		// if no language set, default to Chinese
		if(!lang) {
			lang = 'zh_cn';
			try {
				localStorage.lang = lang;
			} catch(e) {}
		}
		// if a language different than english requested, load all translations
		if(lang && lang != 'en'){
			document.write('<script src="lang/'+lang+'/strings.js"><\/script>');
			document.write('<link rel="stylesheet" type="text/css" href="lang/'+lang+'/main.css" \/>');
		}
	</script>

	<script>
		// 竖屏提示（仅手机，平板不提示）
		(function() {
			function checkOrientation() {
				var msg = document.getElementById('orientation-message');
				if (!msg) return;
				if (window.screen.width < 768 && window.innerHeight > window.innerWidth) {
					msg.style.display = 'flex';
				} else {
					msg.style.display = 'none';
				}
			}
			window.addEventListener('load', checkOrientation);
			window.addEventListener('resize', checkOrientation);
			window.addEventListener('orientationchange', function() {
				setTimeout(checkOrientation, 300);
			});
		})();
	</script>
